name: "Fast Forward Test Suite"

on:
  push:
  workflow_dispatch:

permissions:
  # Ceiling for the checkout-free status publisher; test jobs retain read-only tokens.
  contents: read
  actions: read
  statuses: write

jobs:
  tests:
    uses: php-fast-forward/dev-tools/.github/workflows/tests.yml@main
    with:
      publish-required-statuses: ${{ github.actor != 'dependabot[bot]' }}
